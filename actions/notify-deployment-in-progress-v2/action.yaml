---
name: "Track deployment"
description: "Track a deployment in progress"

inputs:
  application:
    type: string
    required: true
  dd_api_key:
    type: string
    required: true
  former_version:
    type: string
    required: false
  environment:
    type: string
    required: true
  new_version:
    type: string
    required: false
  slack_bot_token:
    type: string
    deprecationMessage: "Ignored: deployments are notified on Slack by the GitHub app."
  slack_channel:
    type: string
    deprecationMessage: "Ignored: deployments are notified on Slack by the GitHub app."
  slack_notify:
    type: boolean
    deprecationMessage: "Ignored: deployments are notified on Slack by the GitHub app."

runs:
  using: "composite"
  steps:
    - name: Track deployment in progresss on datadog
      run: |
        curl --silent -X POST "https://api.datadoghq.eu/api/v1/events" \
        -H "Accept: application/json" \
        -H "Content-Type: application/json" \
        -H "DD-API-KEY: ${DD_API_KEY}" \
        -d @- << EOF
        {
          "title": "Deployment in progress on $APPLICATION",
          "text": "$MESSAGE",
          "tags": [
            "operation:deployment",
            "repository:${{ github.repository }}",
            "env:$ENV",
            "environment:$ENV",
            "application:$APPLICATION"
          ]
        }
        EOF
      shell: bash
      env:
        DD_API_KEY: ${{ inputs.dd_api_key }}
        ENV: ${{ inputs.environment }}
        MESSAGE: ${{ inputs.application }} is being updated from version ${{ inputs.former_version }} to ${{ inputs.new_version }} on ${{ inputs.environment }}
        REPOSITORY: ${{ github.repository }}
        APPLICATION: ${{ inputs.application }}
