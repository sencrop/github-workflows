---
name: Check reserved instances coverage

on:
  workflow_call:
    inputs:
      aws_region:
        type: string
        default: "eu-central-1"
      ci_iam_role:
        type: string
        default: ""
      slack_channel:
        type: string
        default: "ops"
      expiry_warning_days:
        type: string
        default: "60"
      grace_days:
        type: string
        default: "30"
      min_uncovered_units:
        type: string
        default: "1"
      always_notify:
        description: "Post the report to Slack even when nothing needs attention"
        type: boolean
        default: false
      runs_on:
        type: string
        default: ubuntu-latest

jobs:
  check:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure aws credentials
        uses: sencrop/github-workflows/actions/configure-aws-credentials@master
        with:
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          aws_region: ${{ inputs.aws_region }}
          ci_iam_role: ${{ inputs.ci_iam_role }}

      - name: Check reservations
        id: check
        uses: sencrop/github-workflows/actions/reserved-instances-check@master
        with:
          aws_region: ${{ inputs.aws_region }}
          expiry_warning_days: ${{ inputs.expiry_warning_days }}
          grace_days: ${{ inputs.grace_days }}
          min_uncovered_units: ${{ inputs.min_uncovered_units }}

      # Built with jq: the report spans several lines, which can't be inlined in the YAML payload
      - name: Build Slack payload
        if: ${{ steps.check.outputs.alert == 'true' || inputs.always_notify }}
        env:
          CHANNEL: ${{ inputs.slack_channel }}
          EMOJI: ${{ steps.check.outputs.alert == 'true' && ':moneybag:' || ':white_check_mark:' }}
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg channel "$CHANNEL" --arg text "$EMOJI $REPORT"$'\n'"<$RUN_URL|Github Actions>" \
            '{channel: $channel, text: $text}' > "$RUNNER_TEMP/slack-payload.json"

      - name: Notify
        if: ${{ steps.check.outputs.alert == 'true' || inputs.always_notify }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          errors: true
